name: CI - FerdoNAN

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock bandit ruff mypy
    
    - name: Create necessary directories
      run: |
        mkdir -p logs data/cache
        touch logs/ferdonan.log
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term --tb=short -k "not test_agent_integration"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
    
    - name: Validate YAML routes
      run: |
        python scripts/diagnostic/validate_routes.py
    
    - name: Security check (bandit)
      run: |
        bandit -r . -x ./tests,./venv,./docs,./backups,./logs,./data -ll || true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    
    - name: Install linters
      run: |
        pip install ruff mypy
    
    - name: Run Ruff
      run: |
        ruff check . --ignore E501 || true
    
    - name: Run MyPy
      run: |
        mypy core/ models/ security/ --ignore-missing-imports || true

  finish:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check status
      run: |
        echo "✅ CI completed"
