id: "buscador_web"
name: "Buscador Web"
description: "Especialista en buscar información en internet, consultar APIs públicas y resumir páginas web."
short_term_memory_window: 10
execution_mode: "parallel"
llm_provider:
  name: "ollama"
  model: "llama3.2:3b"
  temperature: 0.3
rag_config:
  enabled: false
tools:
  native:
    - name: "web_search"
      script: "tools/native/web_search.py"
      enabled: true
