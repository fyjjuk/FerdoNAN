id: "spotify_player"
name: "Controlador de Spotify"
description: "Controla Spotify: reproducir, pausar, siguiente, anterior."
short_term_memory_window: 4
execution_mode: "parallel"
llm_provider:
  name: "ollama"
  model: "phi3:mini"
  temperature: 0.1
  max_tokens: 50
rag_config:
  enabled: false
tools:
  native:
    - name: "spotify_control"
      script: "tools/native/spotify_control.py"
      enabled: true

router_config:
  mode: "keyword"
  threshold: 0.4
