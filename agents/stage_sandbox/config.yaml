id: "stage_sandbox"
name: "Sandbox de Stages"
description: "Agente aislado para probar el sistema de stages con múltiples LLMs (phi4-mini, llama3.2, Gemini)"
short_term_memory_window: 5
execution_mode: "parallel"
llm_provider:
  name: "ollama"
  model: "phi4-mini"
  temperature: 0.5
  dynamic_resource_management: true
  resource_profiles:
    high:   { model: "qwen2.5:3b", temperature: 0.7, max_tokens: 2048 }
    medium: { model: "llama3.2:3b", temperature: 0.7, max_tokens: 2048 }
    low:    { model: "phi4-mini", temperature: 0.5, max_tokens: 1024 }
rag_config:
  enabled: false

router_config:
  mode: "keyword"
  threshold: 0.3
