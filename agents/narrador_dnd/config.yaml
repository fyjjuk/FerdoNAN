id: "narrador_dnd"
name: "Narrador de D&D - Creador de Historias"
description: "Agente especializado en generar tramas épicas, personajes no jugadores, encuentros de combate, tesoros, mazmorras y chispa creativa para partidas de Dungeons & Dragons 5e. Utiliza memoria de largo plazo para recordar la historia de la campaña."
short_term_memory_window: 15
execution_mode: "parallel"
llm_provider:
  name: "ollama"
  model: "llama3.2:3b"
  temperature: 0.8
  max_tokens: 2048
rag_config:
  enabled: true
  namespace: "dnd_lore"
  top_k: 3
  similarity_threshold: 0.7
tools:
  native:
    - name: "spotify_control"
      script: "tools/native/spotify_control.py"
      enabled: true
    - name: "spotify_playlist"
      script: "tools/native/spotify_playlist.py"
      enabled: true
